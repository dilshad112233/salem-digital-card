<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salem Alhawkash — AMAD Investment Group</title>
<style>
  :root {
    --navy-deep: #0c526f;   /* dark corner arc from the printed card */
    --navy-box: #225064;    /* icon tile background from the sidebar */
    --sky: #64b4d8;         /* banner blue */
    --sky-pale: #eaf6fc;
    --copper: #ae755c;      /* icon accent color from the sidebar */
    --ink: #12242f;
    --paper: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--sky-pale);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(7, 42, 64, 0.18);
  }

  /* header replicates the printed card's opening panel: white field, navy + sky arcs, centered logo */
  .header {
    position: relative;
    height: 200px;
    background: var(--paper);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 6px solid var(--sky);
  }
  .header svg.arcs { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .header .logo-wrap {
    position: relative;
    z-index: 2;
    width: 78%;
  }
  .header .logo-wrap img { width: 100%; display: block; }

  .band {
    background: var(--sky);
    color: var(--paper);
    padding: 14px 28px;
    text-align: center;
  }
  .band .name { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.2px; }

  .body {
    padding: 20px 28px 28px;
    text-align: center;
  }

  .title {
    font-size: 13px;
    color: var(--navy-deep);
    line-height: 1.5;
    margin: 0 0 22px;
    font-weight: 700;
  }

  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }

  .action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 6px;
    border-radius: 16px;
    background: var(--navy-box);
    text-decoration: none;
    color: var(--paper);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .action:active { transform: scale(0.96); }
  .action svg { width: 20px; height: 20px; }
  .action span { font-size: 11.5px; font-weight: 600; }

  .save-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: var(--navy-deep);
    color: #fff;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .save-btn:active { transform: scale(0.98); background: var(--navy-box); }
  .save-btn svg { width: 17px; height: 17px; }

  .divider {
    height: 1px;
    background: #e6edf1;
    margin: 20px 0;
  }

  .contact-list {
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--ink);
  }

  .contact-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--navy-box);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .contact-icon svg { width: 17px; height: 17px; }

  .contact-text {
    display: flex;
    flex-direction: column;
    line-height: 1.35;
  }
  .contact-text .label { font-size: 10.5px; color: #8298a8; font-weight: 600; letter-spacing: 0.3px; }
  .contact-text .value { font-size: 13.5px; font-weight: 600; color: var(--navy-deep); word-break: break-word; }

  .footer-logo {
    margin-top: 24px;
    opacity: 0.9;
  }
  .footer-logo span {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--navy-deep);
    letter-spacing: 0.4px;
  }
</style>
</head>
